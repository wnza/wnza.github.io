<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f3" id="themeColor">
  <script>
    try {
      if (localStorage.getItem('minimal-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  </script>
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="憨憨分享君· 一个极简的个人导航页。常用工具、开发文档、设计灵感、阅读和摸鱼站点，一页收好。">
  <title>憨憨 · 极简导航</title>
  <link rel="shortcut icon" href="https://r.8b.io/160029/assets/images/363957_128x128_1.png" type="image/x-icon">
  <style>
    :root {
      --bg: #f6f6f3;
      --panel: #fbfbf8;
      --card: #ffffff;
      --card-hover: #ffffff;
      --ink: #171717;
      --ink-2: #3b3b38;
      --muted: #77776f;
      --muted-2: #a2a29a;
      --line: #e7e7e1;
      --line-2: #d6d6ce;
      --soft: #efefea;
      --soft-2: #e9e9e3;
      --active: #171717;
      --active-ink: #fbfbf8;
      --shadow: 0 1px 2px rgba(20, 20, 18, .03);
      --font: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      --mono: "SFMono-Regular", "Cascadia Code", "Consolas", monospace;
      --sidebar: 224px;
    }
    html[data-theme="dark"] {
      --bg: #111110;
      --panel: #151514;
      --card: #191918;
      --card-hover: #1e1e1c;
      --ink: #f0f0eb;
      --ink-2: #d2d2cb;
      --muted: #96968d;
      --muted-2: #6f6f68;
      --line: #292927;
      --line-2: #393936;
      --soft: #20201e;
      --soft-2: #262624;
      --active: #f0f0eb;
      --active-ink: #141413;
      --shadow: 0 1px 2px rgba(0,0,0,.18);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background .25s ease, color .25s ease;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }
    ::selection { background: var(--ink); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    .app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }

    /* ---------- sidebar ---------- */
    .sidebar {
      position: sticky; top: 0;
      height: 100vh;
      display: flex; flex-direction: column;
      padding: 27px 16px 18px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 27px; }
    .brand-mark {
      width: 33px; height: 33px;
      display: grid; place-items: center;
      flex: none;
      border-radius: 8px;
      background: var(--active);
      color: var(--active-ink);
      font-family: var(--mono);
      font-size: 14px; font-weight: 700;
      letter-spacing: -.04em;
    }
    .brand-copy { display: flex; flex-direction: column; line-height: 1; }
    .brand-copy strong { font-size: 15px; font-weight: 650; letter-spacing: .1em; }
    .brand-copy small { margin-top: 7px; font-family: var(--mono); font-size: 7px; font-weight: 500; letter-spacing: .16em; color: var(--muted-2); }
    .side-label {
      padding: 0 10px 10px;
      color: var(--muted-2);
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .side-nav { display: flex; flex-direction: column; gap: 3px; }
    .side-link {
      display: flex; align-items: center; gap: 10px;
      min-height: 40px; padding: 0 10px;
      border-radius: 7px;
      color: var(--muted);
      font-size: 13px; font-weight: 500;
      transition: background .18s, color .18s;
    }
    .side-link .icon { width: 16px; height: 16px; stroke-width: 1.6; }
    .side-link .name { flex: 1; }
    .side-link .n { font-family: var(--mono); font-size: 9px; color: var(--muted-2); }
    .side-link:hover { background: var(--soft); color: var(--ink); }
    .side-link.active { background: var(--active); color: var(--active-ink); }
    .side-link.active .n { color: color-mix(in srgb, var(--active-ink) 55%, transparent); }
    .side-foot { margin-top: auto; padding: 17px 9px 2px; border-top: 1px solid var(--line); }
    .clock { display: flex; align-items: baseline; gap: 7px; }
    .clock strong { font-family: var(--mono); font-size: 14px; font-weight: 500; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
    .clock span { font-size: 10px; color: var(--muted-2); }
    .side-foot a { display: inline-block; margin-top: 10px; color: var(--muted-2); font-size: 9.5px; transition: color .18s; }
    .side-foot a:hover { color: var(--ink); }

    /* ---------- main ---------- */
    .main {
      min-width: 0;
      padding: 34px clamp(24px, 4vw, 54px) 52px;
    }
    .main-inner { max-width: 1280px; margin-inline: auto; }
    .main-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px;
    }
    .search {
      flex: 1; max-width: 720px;
      display: flex; align-items: center; gap: 10px;
      height: 50px; padding: 0 14px;
      border: 1px solid var(--line-2);
      border-radius: 9px;
      background: var(--card);
      box-shadow: var(--shadow);
      transition: border-color .2s, box-shadow .2s;
    }
    .search:focus-within { border-color: var(--ink-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 6%, transparent); }
    .search > .icon { width: 17px; height: 17px; color: var(--muted-2); }
    .search input {
      width: 100%; min-width: 0;
      border: 0; outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 13.5px;
    }
    .search input::placeholder { color: var(--muted-2); }
    kbd {
      display: inline-grid; place-items: center;
      min-width: 20px; height: 20px; padding: 0 5px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      color: var(--muted-2);
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1;
    }
    .head-meta { display: flex; align-items: center; gap: 8px; flex: none; }
    .count { margin-right: 5px; color: var(--muted-2); font-size: 10.5px; white-space: nowrap; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 36px; padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 10.5px;
      cursor: pointer;
      transition: border-color .18s, color .18s, background .18s;
    }
    .icon-btn:hover { border-color: var(--line-2); color: var(--ink); background: var(--card); }
    .icon-btn .icon { width: 15px; height: 15px; }
    .round-btn { width: 36px; padding: 0; }
    .theme-toggle .sun { display: block; }
    .theme-toggle .moon { display: none; }
    html[data-theme="dark"] .theme-toggle .sun { display: none; }
    html[data-theme="dark"] .theme-toggle .moon { display: block; }

    .intro {
      display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
      margin: 30px 0 1px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }
    .intro p { margin: 0; color: var(--ink-2); font-size: 14px; letter-spacing: .01em; }
    .intro span { color: var(--muted-2); font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; white-space: nowrap; }

    .groups { padding-top: 8px; }
    .group { padding-top: 29px; scroll-margin-top: 20px; }
    .group-head {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--line);
    }
    .group-title { display: flex; align-items: baseline; gap: 9px; }
    .group-num { font-family: var(--mono); font-size: 9px; color: var(--muted-2); }
    .group-title h2 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: .04em; }
    .group-count { font-family: var(--mono); font-size: 9px; color: var(--muted-2); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .site {
      position: relative;
      display: flex; align-items: flex-start; gap: 12px;
      min-height: 92px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--card);
      box-shadow: var(--shadow);
      transition: border-color .18s, background .18s, transform .18s;
    }
    .site:hover { border-color: var(--line-2); background: var(--card-hover); transform: translateY(-1px); }
    .site-mark {
      width: 38px; height: 38px;
      flex: none;
      display: grid; place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--soft);
      color: var(--ink-2);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
    }
    .site:nth-child(3n+2) .site-mark { background: var(--soft-2); }
    .site-body { min-width: 0; flex: 1; }
    .site-name { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .site-name strong { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
    .site-badge {
      height: 17px; padding: 0 5px;
      display: inline-flex; align-items: center;
      border: 1px solid var(--line-2);
      border-radius: 3px;
      color: var(--muted-2);
      font-style: normal;
      font-size: 7.5px;
      font-family: var(--mono);
      letter-spacing: .04em;
    }
    .site-body small {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 5px;
      color: var(--muted-2);
      font-size: 10.5px;
      line-height: 1.6;
    }
    .site-arrow {
      position: absolute; right: 11px; bottom: 9px;
      color: var(--muted-2);
      font-size: 11px;
      opacity: 0;
      transform: translate(-2px, 2px);
      transition: opacity .18s, transform .18s;
    }
    .site:hover .site-arrow { opacity: 1; transform: translate(0, 0); }

    .empty {
      padding: 80px 20px 70px;
      text-align: center;
    }
    .empty .glyph {
      width: 38px; height: 38px; margin: 0 auto;
      display: grid; place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted-2);
    }
    .empty .glyph .icon { width: 17px; height: 17px; }
    .empty h2 { margin: 16px 0 0; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    .empty p { margin: 7px 0 0; color: var(--muted-2); font-size: 10.5px; }
    .empty-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
    .empty-actions button { height: 31px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); font-size: 9.5px; cursor: pointer; }
    .empty-actions button:hover { border-color: var(--line-2); color: var(--ink); background: var(--card); }

    .footer {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      margin-top: 44px; padding-top: 17px;
      border-top: 1px solid var(--line);
      color: var(--muted-2);
      font-size: 8.5px;
    }
    .footer a { transition: color .18s; }
    .footer a:hover { color: var(--ink); }

    .toast {
      position: fixed; left: 50%; bottom: 22px;
      z-index: 30;
      padding: 8px 12px;
      border: 1px solid var(--line-2);
      border-radius: 6px;
      background: var(--active);
      color: var(--active-ink);
      font-size: 10px;
      box-shadow: 0 10px 28px -14px rgba(0,0,0,.4);
      opacity: 0;
      transform: translate(-50%, 8px);
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 960px) {
      :root { --sidebar: 0px; }
      .app { display: block; }
      .sidebar {
        position: sticky; top: 0;
        height: auto;
        flex-direction: row;
        align-items: center;
        gap: 14px;
        padding: 10px 16px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        backdrop-filter: blur(14px);
      }
      .brand { padding: 0; flex: none; }
      .brand-mark { width: 29px; height: 29px; font-size: 12px; }
      .brand-copy small { display: none; }
      .brand-copy strong { font-size: 12px; }
      .side-label, .side-foot { display: none; }
      .side-nav {
        flex-direction: row;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
        padding-left: 3px;
      }
      .side-nav::-webkit-scrollbar { display: none; }
      .side-link { min-height: 30px; padding: 0 9px; gap: 7px; font-size: 10.5px; flex: none; border-radius: 0; }
      .side-link .icon { width: 13px; height: 13px; }
      .side-link .n { display: none; }
      .side-link.active { background: transparent; color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
      .main { padding: 20px 16px 36px; }
      .main-head { flex-wrap: wrap; gap: 10px; }
      .search { flex: 1 1 100%; max-width: none; height: 44px; }
      .head-meta { width: 100%; justify-content: space-between; }
      .intro { margin-top: 19px; padding-bottom: 18px; }
      .intro p { font-size: 11.5px; }
      .intro span { display: none; }
      .group { padding-top: 23px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 10px; }
      .site { min-height: 80px; padding: 12px; }
      .footer { margin-top: 32px; font-size: 8px; }
    }
    @media (max-width: 540px) {
      .brand-mark { width: 27px; height: 27px; font-size: 11px; }
      .brand-copy strong { font-size: 11px; }
      .side-link { font-size: 9.5px; padding: 0 7px; }
      .side-link .icon { display: none; }
      .grid { grid-template-columns: 1fr; }
      .site { min-height: 76px; }
      .site-arrow { opacity: 1; transform: none; }
      .head-meta .count { display: none; }
      .footer { flex-direction: column; align-items: flex-start; gap: 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>

    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" aria-label="分类导航">
      <a class="brand" href="#top" aria-label="简页首页">
        <span class="brand-mark">简</span>
        <span class="brand-copy"><strong>简页</strong><small>MINIMAL START</small></span>
      </a>
      <div class="side-label">Collections</div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot">
        <div class="clock"><strong id="clockTime">--:--</strong><span id="clockDate"></span></div>
        <a href="#top">回到顶部 ↑</a>
      </div>
    </aside>

    <main class="main" id="top">
      <div class="main-inner">
        <header class="main-head">
          <label class="search">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <span class="sr-only">搜索站点</span>
            <input id="searchInput" type="text" placeholder="搜索站点，或输入关键词…" spellcheck="false" autocomplete="off">
            <kbd>/</kbd>
          </label>
          <div class="head-meta">
            <span class="count" id="resultCount">0 个站点</span>
            <button class="icon-btn" id="randomBtn" type="button" title="随机打开一个站点">
              <svg class="icon" aria-hidden="true"><use href="#i-random"/></svg>随机
            </button>
            <button class="icon-btn round-btn theme-toggle" id="themeToggle" type="button" aria-label="切换深色主题" title="切换明暗主题">
              <svg class="icon sun" aria-hidden="true"><use href="#i-sun"/></svg>
              <svg class="icon moon" aria-hidden="true"><use href="#i-moon"/></svg>
            </button>
          </div>
        </header>

        <div class="intro">
          <p>把常用的地方，放在一页里。</p>
          <span>HAND PICKED · KEEP IT SIMPLE</span>
        </div>

        <div class="groups" id="groups"></div>

        <div class="empty" id="empty" hidden>
          <div class="glyph"><svg class="icon" aria-hidden="true"><use href="#i-empty"/></svg></div>
          <h2>没有找到「<span id="emptyQuery"></span>」</h2>
          <p>换个关键词试试，或者去搜索引擎看看。</p>
          <div class="empty-actions">
            <button type="button" data-engine="bing">在必应中搜索</button>
            <button type="button" data-engine="baidu">在百度中搜索</button>
            <button type="button" id="clearSearch">清除搜索</button>
          </div>
        </div>

        <footer class="footer">
          <span>© 2026 简页 · <span id="footerCount">0</span> 个站点</span>
          <span>个人收藏 · 保持简单 · <a href="#top">回到顶部 ↑</a></span>
        </footer>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const SITES = [
      { cat: '常用', name: '憨憨去水印', desc: '抖音视频与图集无水印提取', url: 'https://wnza.github.io/douyin-clean/', mark: '憨', badge: '本站' },
      { cat: '常用', name: 'GitHub', desc: '代码托管与开源项目', url: 'https://github.com/', mark: 'G' },
      { cat: '常用', name: '哔哩哔哩', desc: '视频、番剧与创作者社区', url: 'https://www.bilibili.com/', mark: 'B' },
      { cat: '常用', name: '知乎', desc: '问答与经验分享', url: 'https://www.zhihu.com/', mark: '知' },

      { cat: '开发', name: 'MDN', desc: 'Web 开发文档与教程', url: 'https://developer.mozilla.org/zh-CN/', mark: 'M' },
      { cat: '开发', name: 'Vue 3', desc: '渐进式 JavaScript 框架', url: 'https://cn.vuejs.org/', mark: 'V' },
      { cat: '开发', name: 'Vite', desc: '下一代前端构建工具', url: 'https://vite.dev/', mark: 'V' },
      { cat: '开发', name: 'Stack Overflow', desc: '程序员的问答社区', url: 'https://stackoverflow.com/', mark: 'S' },
      { cat: '开发', name: 'npm', desc: 'JavaScript 包管理仓库', url: 'https://www.npmjs.com/', mark: 'n' },
      { cat: '开发', name: 'Can I use', desc: '浏览器兼容性查询', url: 'https://caniuse.com/', mark: 'C' },

      { cat: '设计', name: 'Figma', desc: '在线协作设计工具', url: 'https://www.figma.com/', mark: 'F' },
      { cat: '设计', name: 'Dribbble', desc: '设计灵感与作品集', url: 'https://dribbble.com/', mark: 'D' },
      { cat: '设计', name: 'Unsplash', desc: '高质量免费图片', url: 'https://unsplash.com/', mark: 'U' },
      { cat: '设计', name: 'Iconify', desc: '统一图标集合', url: 'https://icon-sets.iconify.design/', mark: 'I' },

      { cat: '阅读', name: '微信读书', desc: '随时随地的阅读', url: 'https://weread.qq.com/', mark: '读' },
      { cat: '阅读', name: '豆瓣读书', desc: '书评、评分与书单', url: 'https://book.douban.com/', mark: '豆' },
      { cat: '阅读', name: '少数派', desc: '高效工作与数字生活', url: 'https://sspai.com/', mark: '少' },
      { cat: '阅读', name: '阮一峰周刊', desc: '科技与编程每周分享', url: 'https://www.ruanyifeng.com/blog/', mark: '阮' },

      { cat: '工具', name: 'Excalidraw', desc: '手绘风在线白板', url: 'https://excalidraw.com/', mark: 'E' },
      { cat: '工具', name: 'TinyPNG', desc: '在线图片压缩', url: 'https://tinypng.com/', mark: 'T' },
      { cat: '工具', name: 'Regex101', desc: '正则表达式调试', url: 'https://regex101.com/', mark: 'R' },
      { cat: '工具', name: 'JSON.cn', desc: 'JSON 格式化与校验', url: 'https://www.json.cn/', mark: 'J' },
      { cat: '工具', name: 'Carbon', desc: '把代码变成漂亮图片', url: 'https://carbon.now.sh/', mark: 'C' },

      { cat: '娱乐', name: 'YouTube', desc: '视频与创作者', url: 'https://www.youtube.com/', mark: 'Y' },
      { cat: '娱乐', name: '网易云音乐', desc: '音乐与歌单', url: 'https://music.163.com/', mark: '云' },
      { cat: '娱乐', name: '豆瓣', desc: '电影、书籍与生活', url: 'https://www.douban.com/', mark: '豆' },
      { cat: '娱乐', name: '小红书', desc: '生活方式分享社区', url: 'https://www.xiaohongshu.com/', mark: '红' }
    ];

    const CATEGORIES = [
      { name: '常用', icon: 'home', slug: 'common' },
      { name: '开发', icon: 'code', slug: 'dev' },
      { name: '设计', icon: 'pen', slug: 'design' },
      { name: '阅读', icon: 'book', slug: 'read' },
      { name: '工具', icon: 'tool', slug: 'tools' },
      { name: '娱乐', icon: 'play', slug: 'fun' }
    ];

    const ENGINES = {
      bing: 'https://www.bing.com/search?q=',
      baidu: 'https://www.baidu.com/s?wd='
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
    const root = document.documentElement;
    const sideNav = $('#sideNav');
    const groupsEl = $('#groups');
    const searchInput = $('#searchInput');
    const resultCount = $('#resultCount');
    const empty = $('#empty');
    const emptyQuery = $('#emptyQuery');
    const toastEl = $('#toast');
    let toastTimer = 0;
    let activeCategory = CATEGORIES[0].name;

    function openUrl(url) {
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function showToast(text) {
      clearTimeout(toastTimer);
      toastEl.textContent = text;
      toastEl.classList.add('show');
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    function renderSidebar() {
      sideNav.replaceChildren(...CATEGORIES.map((cat) => {
        const count = SITES.filter(site => site.cat === cat.name).length;
        const a = document.createElement('a');
        a.className = 'side-link' + (cat.name === activeCategory ? ' active' : '');
        if (cat.name === activeCategory) a.setAttribute('aria-current', 'true');
        a.href = `#cat-${cat.slug}`;
        a.dataset.cat = cat.name;
        a.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#i-${cat.icon}"/></svg><span class="name">${cat.name}</span><span class="n">${String(count).padStart(2, '0')}</span>`;
        a.addEventListener('click', () => {
          if (searchInput.value) {
            searchInput.value = '';
            applyFilter('');
          }
          setActive(cat.name);
        });
        return a;
      }));
    }

    function renderGroups() {
      groupsEl.replaceChildren(...CATEGORIES.map((cat, catIndex) => {
        const items = SITES.filter(site => site.cat === cat.name);
        const section = document.createElement('section');
        section.className = 'group';
        section.id = `cat-${cat.slug}`;
        section.dataset.cat = cat.name;

        const head = document.createElement('div');
        head.className = 'group-head';
        const title = document.createElement('div');
        title.className = 'group-title';
        title.innerHTML = `<span class="group-num">${String(catIndex + 1).padStart(2, '0')}</span><h2>${cat.name}</h2>`;
        const count = document.createElement('span');
        count.className = 'group-count';
        count.textContent = String(items.length).padStart(2, '0');
        head.append(title, count);

        const grid = document.createElement('div');
        grid.className = 'grid';
        items.forEach((item) => {
          const a = document.createElement('a');
          a.className = 'site';
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.dataset.search = `${item.cat} ${item.name} ${item.desc} ${item.url}`.toLowerCase();
          a.innerHTML = `
            <span class="site-mark">${item.mark}</span>
            <span class="site-body">
              <span class="site-name"><strong>${item.name}</strong>${item.badge ? `<em class="site-badge">${item.badge}</em>` : ''}</span>
              <small>${item.desc}</small>
            </span>
            <span class="site-arrow">↗</span>`;
          grid.append(a);
        });

        section.append(head, grid);
        return section;
      }));
    }

    function setActive(cat) {
      activeCategory = cat;
      $$('.side-link').forEach(link => {
        const active = link.dataset.cat === cat;
        link.classList.toggle('active', active);
        if (active) link.setAttribute('aria-current', 'true');
        else link.removeAttribute('aria-current');
      });
    }

    function updateCount(visible = SITES.length, term = '') {
      resultCount.textContent = term ? `找到 ${visible} 个` : `${SITES.length} 个站点`;
      $('#footerCount').textContent = String(SITES.length);
    }

    function applyFilter(rawTerm) {
      const term = rawTerm.trim().toLowerCase();
      let visible = 0;
      $$('.site').forEach(card => {
        const match = !term || card.dataset.search.includes(term);
        card.hidden = !match;
        if (match) visible += 1;
      });
      $$('.group').forEach(group => {
        const has = $$('.site', group).some(card => !card.hidden);
        group.hidden = !has;
      });
      empty.hidden = visible > 0 || !term;
      emptyQuery.textContent = rawTerm.trim();
      updateCount(visible, term);
    }

    function randomSite() {
      const visible = $$('.site').filter(card => !card.hidden);
      const pool = visible.length ? visible : $$('.site');
      const card = pool[Math.floor(Math.random() * pool.length)];
      if (!card) return;
      showToast(`随机打开：${card.querySelector('.site-name strong').textContent}`);
      openUrl(card.href);
    }

    function updateClock() {
      const now = new Date();
      $('#clockTime').textContent = new Intl.DateTimeFormat('zh-CN', {
        hour: '2-digit', minute: '2-digit', hour12: false
      }).format(now);
      $('#clockDate').textContent = new Intl.DateTimeFormat('zh-CN', {
        month: 'numeric', day: 'numeric', weekday: 'short'
      }).format(now);
    }

    function applyTheme(theme) {
      root.dataset.theme = theme;
      $('#themeColor').setAttribute('content', theme === 'dark' ? '#111110' : '#f6f6f3');
      $('#themeToggle').setAttribute('aria-label', theme === 'dark' ? '切换浅色主题' : '切换深色主题');
      try { localStorage.setItem('minimal-theme', theme); } catch (e) {}
    }

    function bind() {
      renderSidebar();
      renderGroups();
      updateCount();
      updateClock();
      setInterval(updateClock, 30000);

      const savedTheme = (() => {
        try { return localStorage.getItem('minimal-theme') || ''; } catch (e) { return ''; }
      })();
      applyTheme(savedTheme === 'dark' ? 'dark' : 'light');

      searchInput.addEventListener('input', () => applyFilter(searchInput.value));

      $('#themeToggle').addEventListener('click', () => {
        applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
      });
      $('#randomBtn').addEventListener('click', randomSite);
      $('#clearSearch').addEventListener('click', () => {
        searchInput.value = '';
        applyFilter('');
        searchInput.focus();
      });

      $$('.empty-actions [data-engine]').forEach(button => {
        button.addEventListener('click', () => {
          const term = searchInput.value.trim() || emptyQuery.textContent;
          if (term) openUrl(ENGINES[button.dataset.engine] + encodeURIComponent(term));
        });
      });

      document.addEventListener('keydown', (event) => {
        const tag = (event.target && event.target.tagName || '').toLowerCase();
        const typing = ['input', 'textarea', 'select'].includes(tag);
        if (event.key === '/' && !typing) {
          event.preventDefault();
          searchInput.focus();
        }
        if (event.key === 'Escape' && document.activeElement === searchInput) {
          searchInput.value = '';
          applyFilter('');
          searchInput.blur();
        }
      });

      let scrollTicking = false;
      const syncActive = () => {
        scrollTicking = false;
        if (searchInput.value.trim()) return;
        const sections = $$('.group').filter(group => !group.hidden);
        if (!sections.length) return;
        const marker = window.scrollY + 140;
        let current = sections[0];
        sections.forEach(section => {
          const top = section.getBoundingClientRect().top + window.scrollY;
          if (top <= marker) current = section;
        });
        setActive(current.dataset.cat);
      };
      window.addEventListener('scroll', () => {
        if (scrollTicking) return;
        scrollTicking = true;
        requestAnimationFrame(syncActive);
      }, { passive: true });
      syncActive();
    }

    bind();
  </script>
</body>
</html>
